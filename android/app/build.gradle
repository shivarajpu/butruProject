apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    //
    //   CRITICAL once flavors exist: variant names become <flavor>Debug, which no
    //   longer matches the default ["debug"]. Left unset, Gradle would bundle JS
    //   into debug builds and the app would ignore Metro — no fast refresh, no
    //   live reload. The list below is generated from clients/clients.json.
    // ── clients:sync:begin debuggableVariants ──
    // Generated by `npm run clients:sync` — kept in step with productFlavors.
    debuggableVariants = [
        "butruDebug",
        "butruDebugOptimized",
        "clientaDebug",
        "clientaDebugOptimized"
    ]
// ── clients:sync:end debuggableVariants ─────────────────────────────────

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// ═══════════════════════════════════════════════════════════════════════════
// MULTI-CLIENT BUILD SUPPORT
// ═══════════════════════════════════════════════════════════════════════════
//
// `clients/active.json` is written by `npm run clients:sync`. Gradle reads that
// file rather than taking CLI flags, so the JS bundle, Gradle and Xcode can never
// disagree about which client and environment is being built.

def clientsActiveFile = rootProject.file("../clients/active.json")
def clientsActive
if (clientsActiveFile.exists()) {
    def json = new groovy.json.JsonSlurper().parse(clientsActiveFile)
    clientsActive = [
        id           : json.id,
        baseUrl      : json.baseUrl,
        displayName  : json.displayName,
        applicationId: json.android.applicationId,
        bundleId     : json.ios.bundleId
    ]
} else {
    // Not fatal: a bare `./gradlew` with no prior sync still works for the
    // default client. Run `npm run clients:sync` to build anything else.
    clientsActive = [
        id           : "butru",
        baseUrl      : "https://api.butru.in",
        displayName  : "Butru",
        applicationId: "com.butruproject",
        bundleId     : "com.butruproject"
    ]
    logger.lifecycle(
        "[clients] clients/active.json missing — defaulting to " +
        "${clientsActive.id}. Run: npm run clients:sync")
}

// ── usesCleartextTraffic is NOT ours ─────────────────────────────────────────
//
// AndroidManifest.xml references ${usesCleartextTraffic}, but the value is
// supplied by React Native itself: @react-native/gradle-plugin's
// AgpConfiguratorUtils.configureBuildTypesForApp() hardcodes true for
// `debug`/`debugOptimized` and false for `release`, from a `finalizeDsl` hook —
// which runs *after* this script's `android { }` block. Anything set here is
// overwritten, no matter where it is set.
//
// So there is deliberately no cleartext knob in clients.json. A flag that
// silently does nothing is worse than no flag: it would read as "release is
// locked down" while giving no evidence either way. Correct today because both
// clients are https; if a client ever needs plain HTTP, the honest fix is a
// network-security-config, not a placeholder that Gradle drops on the floor.

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.butruproject"
    defaultConfig {
        applicationId "com.butruproject"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    // ── clients:sync:begin flavors ──
    // Generated by `npm run clients:sync` — edit clients/clients.json instead.
    //
    // `namespace` deliberately stays com.butruproject: MainActivity and
    // MainApplication live in that Kotlin package and AndroidManifest refers to
    // them as ".MainActivity", so only `applicationId` varies per client.
    // Adding a client never means moving a .kt file.
    flavorDimensions "client"
    productFlavors {
    // Butru   (default — keeps the pre-flavour IDs)
    create("butru") {
        dimension "client"
        versionCode 1
        resValue "string", "build_client", "butru"
        resValue "string", "client_store_id", "6a20248bf77d663ca797ce90"
        resValue "string", "client_store_slug", "butru-store"
    }

    // Client A
    create("clienta") {
        dimension "client"
        applicationId "com.company.clienta"
        versionCode 1
        resValue "string", "build_client", "clienta"
        resValue "string", "client_store_id", "6ac4a42b2128c79004b23610"
        resValue "string", "client_store_slug", "butru-store"
    }
    }
// ── clients:sync:end flavors ───────────────────────────────────────────

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // PHASE 10 — the real per-client release keystore goes here.
        // Credentials come from ~/.gradle/gradle.properties or CI secrets,
        // never from this file. Until then `release` falls back to the debug
        // key and Play Console rejects the upload.
        // release {
        //     storeFile     file(providers.gradleProperty("BUTRU_STORE_FILE").get())
        //     storePassword providers.gradleProperty("BUTRU_STORE_PASSWORD").get()
        //     keyAlias      providers.gradleProperty("BUTRU_KEY_ALIAS").get()
        //     keyPassword   providers.gradleProperty("BUTRU_KEY_PASSWORD").get()
        // }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // `.debug` lets a dev build sit next to that client's store build on
            // one device. Release keeps the exact store applicationId.
            applicationIdSuffix ".debug"
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
